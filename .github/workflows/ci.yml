name: CI

on:
  pull_request:
  push:
    branches: [ main, prod ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make bin/ scripts executable
        run: chmod +x bin/*

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager --ignore-config config/brakeman.ignore

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make bin/ scripts executable
        run: chmod +x bin/*

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make bin/ scripts executable
        run: chmod +x bin/*

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  nesting_engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libboost-dev

      - name: Install nesting engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke check pynest2d / libnest2d
        run: |
          python -c "from pynest2d import Box, nest; print('pynest2d OK')"
          python -c "from nesting_engine.nest_libnest2d import capabilities; c = capabilities(); assert c.spike_only is False; assert 'libnest2d' in c.library.lower()"

      - name: Run nesting_engine pytest suite
        run: pytest nesting_engine/ -q

  rspec:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: fitloop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: password
      ONVO_SECRET_KEY: onvo_test_secret_dummy
      ONVO_PUBLISHABLE_KEY: onvo_test_publishable_dummy
      ONVO_WEBHOOK_SECRET: whsec_test_onvo_dummy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make bin/ scripts executable
        run: chmod +x bin/*

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system compilation dependencies for nesting engine
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libboost-dev

      - name: Create Python virtual environment and install requirements
        run: |
          python -m venv nesting_engine/.venv
          nesting_engine/.venv/bin/pip install --upgrade pip
          nesting_engine/.venv/bin/pip install -r requirements.txt
          ln -s nesting_engine/.venv .venv

      - name: Set up database schema
        run: |
          bin/rails db:prepare

      - name: Run RSpec test suite
        run: |
          bundle exec rspec
