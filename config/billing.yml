# Fitloop — precios simulados (v1, REQ-FIT-BILL-001 / D53).
# Abra este archivo, edite los valores y guarde; la app recarga sola al cambiar el archivo (mtime).
# Tablas MEIC: oficial (tarjeta) / descuento = oficial − sinpe / precio final SINPE.

# Canonical pricing tables (MEIC): nested per-product structure (D25).
products:
  single_download:
    official:
      crc: 1200
      usd: 2.50
    sinpe:
      crc: 1000
      usd: 2.00
    overage:
      official:
        crc: 600
        usd: 1.25
      sinpe:
        crc: 500
        usd: 1.00
  plan_1_month:
    official:
      crc: 3250
      usd: 7.00
    sinpe:
      crc: 3000
      usd: 6.50
  plan_2_months:
    official:
      crc: 5300
      usd: 11.50
    sinpe:
      crc: 5000
      usd: 10.75
  plan_4_months:
    official:
      crc: 8400
      usd: 18.00
    sinpe:
      crc: 8000
      usd: 17.00

# --- Descarga suelta ---
single_download_official_crc: 1200
single_download_sinpe_crc: 1000
single_download_official_usd: 2.50
single_download_sinpe_usd: 2.00
# Legacy alias (precio final SINPE USD):
