# Fitloop — precios simulados (v1, REQ-FIT-BILL-001 / D53).
# Abra este archivo, edite los valores y guarde; la app recarga sola al cambiar el archivo (mtime).
# Moneda: descarga suelta y planes en USD (tarjeta) o CRC (SINPE Móvil).

# Canonical pricing tables (MEIC): nested per-product structure (D25).
products:
  single_download:
    official:
      crc: 1200
      usd: 2.50
    sinpe:
      crc: 1000
      usd: 2.00
    overage:
      official:
        crc: 600
        usd: 1.25
      sinpe:
        crc: 500
        usd: 1.00

# --- Descarga suelta (un nested DXF por pago exitoso) ---
single_download_usd: 2.00
single_download_sinpe_crc: 1000
single_download_official_crc: 1200
single_download_official_usd: 2.50
single_download_sinpe_usd: 2.00

# Overage explícito (no %): cuando el cupo mensual del plan está agotado (D28).
single_download_overage_usd: 1.00
single_download_overage_sinpe_crc: 500
single_download_overage_official_crc: 600
single_download_overage_official_usd: 1.25
single_download_overage_sinpe_usd: 1.00

# Porcentaje del precio suelta cuando el cupo mensual del plan está agotado (D34: 50 → mitad)
plan_quota_overage_percent: 50

# --- Planes por duración (1, 2 y 4 meses; no existe tier de 3 meses) ---
plan_1_month_card_usd: 6
plan_1_month_sinpe_crc: 3000
plan_2_months_card_usd: 10
plan_2_months_sinpe_crc: 5000
plan_4_months_card_usd: 16
plan_4_months_sinpe_crc: 8000
